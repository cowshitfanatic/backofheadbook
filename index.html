<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Back of Head Book — a smaller, stranger social network.">
<title>Back of Head Book</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="logo" data-view="feed" aria-label="Back of Head Book home"><span class="logoMark">b</span><span>back of head book</span></button>
    <div class="searchWrap"><span>⌕</span><input id="search" placeholder="Search people, posts, groups..." autocomplete="off"></div>
    <nav class="topnav">
      <button data-view="profile" class="profileLink"><span class="miniAvatar">MC</span><span>Max</span></button>
      <button id="messages" aria-label="Messages">✉<i>2</i></button>
      <button id="alerts" aria-label="Notifications">♢<i>3</i></button>
      <button id="settings" aria-label="Settings">⚙</button>
    </nav>
  </div>
</header>

<div class="networkLine"><span></span><b>THE INTERNET, BUT SMALLER</b><span></span></div>

<main>
  <aside id="left">
    <div class="me">
      <span class="avatar big">MC</span>
      <div><button data-view="profile">Max Cowley</button><small><span class="onlineDot"></span> online · Kentucky</small></div>
    </div>
    <nav class="side">
      <button class="active" data-view="feed"><span>⌂</span> News Feed</button>
      <button data-view="friends"><span>♙</span> Friends <em id="friendsCount">4</em></button>
      <button data-view="groups"><span>◫</span> Groups</button>
      <button data-view="events"><span>◷</span> Events</button>
      <button data-view="saved"><span>▱</span> Saved</button>
      <button data-view="memories"><span>↺</span> Memories</button>
      <label>EXPLORE</label>
      <button data-view="people"><span>⌕</span> People</button>
      <button data-view="about"><span>?</span> About</button>
    </nav>
    <footer>Privacy · Terms · Help<br>© 2008–2026 Back of Head Book</footer>
  </aside>

  <section id="content"></section>
  <aside id="right"></aside>
</main>

<div id="toast" class="toast"></div>
<div id="modal" class="hidden">
  <div class="dialog">
    <header><b id="modalTitle"></b><button id="close" aria-label="Close">×</button></header>
    <div id="modalBody"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
